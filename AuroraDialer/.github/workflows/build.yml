name: Build Aurora Dialer APK (manual)

# ------------------------------------------------------------------------------------------------
# This workflow NEVER runs by itself.
#
# Pushing code, uploading files, opening a pull request or pushing a tag does nothing.
# A build starts only when it is started by hand: Actions tab -> "Build Aurora Dialer APK (manual)"
# -> Run workflow, and there a version name and a version code MUST be typed in first.
#
# When it finishes it uploads, as build artifacts and as GitHub Release assets:
#   * the APK,
#   * the OTA update manifests (aurora-stable.json / aurora-beta.json / aurora-dev.json) that the
#     app's Software update screen reads - written automatically, never edited by hand.
# Nothing else is attached to a release - no source archive. (If a source ZIP is ever wanted again,
# `git archive --format=zip -o source.zip HEAD` makes one locally: it packs the committed files only,
# so it never contains the .git history folder. It is deliberately NOT part of this build.)
# Running the same version name + code again REPLACES the files of that release instead of failing,
# so a rebuild can be shipped with the same version.
#
# The manifests are derived from the version name + code typed in below, never edited by hand: the
# run reads them back out of the finished APK, writes them into aurora-stable/beta/dev.json and
# refuses to publish if the two do not match.
#
# The Android SDK step is deliberately self-contained (no android-actions/setup-android): the SDK on
# the runner image is reused, and the command-line tools are downloaded only when it has none.
#
# Signing: nothing is signed with a key kept in the repository. Either leave it alone (Gradle's own
# debug key is used) or add the secrets AURORA_KEYSTORE_BASE64 / AURORA_KEYSTORE_PASSWORD /
# AURORA_KEY_ALIAS / AURORA_KEY_PASSWORD and every build is signed with that key.
# ------------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 26.10.14-Aurora (required)'
        required: true
        type: string
      version_code:
        description: 'Version code, whole number, must go up, e.g. 261014 (required)'
        required: true
        type: string
      changelog:
        description: 'What changed - shown on the in-app Software update screen (optional)'
        required: false
        type: string
      build_type:
        description: 'Which APK(s) to compile'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - both
          - debug
      publish_release:
        description: 'Publish the APK + OTA manifest to a GitHub Release'
        required: false
        default: true
        type: boolean
      update_channel:
        description: 'OTA channel of the generated manifest'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev

permissions:
  contents: write

# One build at a time: a second run waits instead of fighting over the same release tag.
concurrency:
  group: aurora-dialer-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.version_name }} (${{ inputs.version_code }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version inputs
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          NAME="$(printf '%s' "${INPUT_VERSION_NAME:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          CODE="$(printf '%s' "${INPUT_VERSION_CODE:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          BUILD_TYPE="${INPUT_BUILD_TYPE:-release}"

          if [ -z "$NAME" ]; then
            echo "::error::version_name is required - type the version you want to build."
            exit 1
          fi
          if ! printf '%s' "$CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code must be a whole number without dots or letters (e.g. 261014), got '$CODE'."
            exit 1
          fi

          # Android stores the code as a number, so "01" would come back out of the APK as "1" and
          # every later comparison would mismatch. Normalise it here, once, for the whole run.
          CODE_RAW="$CODE"
          CODE="$(printf '%s' "$CODE" | awk '{ printf "%d", $1 }')"
          if [ "$CODE_RAW" != "$CODE" ]; then
            echo "note: version_code '$CODE_RAW' normalised to '$CODE' (an APK stores no leading zeros)."
          fi
          if [ "$CODE" -lt 1 ]; then
            echo "::error::version_code must be 1 or more, got '$CODE_RAW'."
            exit 1
          fi
          case "$BUILD_TYPE" in
            release|debug|both) ;;
            *) BUILD_TYPE="release" ;;
          esac

          SAFE_NAME="$(printf '%s' "$NAME" | tr ' /:' '---')"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "safe_version_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          echo "Building Aurora Dialer (com.aurora.dialer)"
          echo "  versionName : $NAME"
          echo "  versionCode : $CODE"
          echo "  buildType   : $BUILD_TYPE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up the Android SDK
        env:
          # Overridable through a repository secret if a mirror is ever needed.
          SDK_ZIP_URL: ${{ secrets.ANDROID_CMDLINE_TOOLS_URL || 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' }}
        run: |
          set -euo pipefail

          # The runner image already carries an Android SDK: take that one when it has
          # cmdline-tools and only download them when it does not. This replaces
          # android-actions/setup-android, which failed here before any build step could run.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using the SDK that comes with the runner: $SDK"
          else
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            echo "Downloading the command-line tools..."
            curl -fsSL "${SDK_ZIP_URL:-https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip}" \
              -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q -o "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
          fi

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::sdkmanager is missing in $SDK"
            ls -R "$SDK" | head -40 || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

          echo "platforms:"
          ls "$SDK/platforms"
          echo "build-tools:"
          ls "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare the signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The key itself is never kept in the repository. Add it as a repository secret
          # (AURORA_KEYSTORE_BASE64 = base64 of your .jks) and every build is signed with it, which
          # is what lets an installed copy be replaced without uninstalling first. Without the
          # secret the build falls back to Gradle's own debug key.
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurora.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/aurora.jks"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
              echo "KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-android}"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository's own key."
          else
            echo "No signing secret configured - signing with Gradle's debug key."
          fi

      - name: Build APK(s)
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        run: |
          set -euo pipefail
          TASKS=""
          case "$BUILD_TYPE" in
            release) TASKS="assembleRelease" ;;
            debug)   TASKS="assembleDebug" ;;
            both)    TASKS="assembleRelease assembleDebug" ;;
          esac

          ./gradlew $TASKS \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}" \
            --no-daemon --stacktrace

      - name: Collect and verify APKs
        id: artifacts
        env:
          SAFE_VERSION_NAME: ${{ steps.version.outputs.safe_version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          MAX_BYTES=$((25 * 1024 * 1024))
          FOUND=0

          for VARIANT in release debug; do
            SRC="build/outputs/apk/${VARIANT}/AuroraDialer-${VARIANT}.apk"
            [ -f "$SRC" ] || continue
            OUT="dist/AuroraDialer-${SAFE_VERSION_NAME}-${VERSION_CODE}-${VARIANT}.apk"
            cp "$SRC" "$OUT"
            SIZE_BYTES=$(stat -c%s "$OUT")
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024 * 1024)}")
            echo "${VARIANT} APK: $OUT (${SIZE_MB} MB)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "::error::${VARIANT} APK is larger than the 25 MB limit (${SIZE_MB} MB)"
              exit 1
            fi
            FOUND=$((FOUND + 1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No APK was produced - check the build log above."
            exit 1
          fi

          ls -lh dist/

      - name: Write the update manifests
        env:
          CHANNEL: ${{ inputs.update_channel || 'stable' }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SAFE_VERSION_NAME: ${{ steps.version.outputs.safe_version_name }}
          REPO: ${{ github.repository }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          APK=$(ls dist/*-release.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::warning::No release APK in this run; skipping the update manifests."
            exit 0
          fi

          CHANGELOG="${CHANGELOG_INPUT:-}"
          if [ -z "$CHANGELOG" ]; then
            # Falls back to the commit this run was built from, so a release never ships without one.
            CHANGELOG=$(git log -1 --pretty=%s 2>/dev/null || true)
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="Aurora Dialer update"

          # Read the version straight out of the APK that was just built and stop unless it is
          # exactly what was typed in, so the manifest can never describe a different build.
          AAPT2="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort | tail -1)"
          # sed (not head) reads the whole stream: with pipefail, head closing the pipe early would look like a
          # failed step.
          BADGING=$("$AAPT2" dump badging "$APK" | sed -n '1p')
          APK_VERSION_CODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          APK_VERSION_NAME=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "typed in  : $VERSION_NAME ($VERSION_CODE)"
          echo "in the APK: $APK_VERSION_NAME ($APK_VERSION_CODE)"
          if [ "$APK_VERSION_CODE" != "$VERSION_CODE" ]; then
            echo "::error::The APK carries versionCode $APK_VERSION_CODE but $VERSION_CODE was typed in."
            exit 1
          fi
          if [ "$APK_VERSION_NAME" != "$VERSION_NAME" ]; then
            echo "::error::The APK carries versionName '$APK_VERSION_NAME' but '$VERSION_NAME' was typed in."
            exit 1
          fi

          APK_PATH="$APK" OUT_DIR="dist" \
          VERSION_NAME="$APK_VERSION_NAME" VERSION_CODE="$APK_VERSION_CODE" \
          SAFE_VERSION_NAME="$SAFE_VERSION_NAME" CHANNEL="$CHANNEL" \
          REPO="$REPO" CHANGELOG="$CHANGELOG" \
          python3 - <<'PY'
          import hashlib, json, os, re, time

          apk = os.environ["APK_PATH"]
          repo = os.environ["REPO"]
          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          channel = os.environ["CHANNEL"]
          tag = "v%s-%s" % (os.environ["SAFE_VERSION_NAME"], os.environ["VERSION_CODE"])

          digest = hashlib.sha256()
          with open(apk, "rb") as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(block)
          sha256 = digest.hexdigest()
          size = os.path.getsize(apk)

          changelog = os.environ["CHANGELOG"].strip()
          if "\n" not in changelog:
              changelog = "- " + changelog

          def manifest(for_channel, apk_name, sha, size_bytes):
              return {
                  "schema": 1,
                  "channel": for_channel,
                  "package": "com.aurora.dialer",
                  "versionName": version_name,
                  "versionCode": version_code,
                  "minSdk": 30,
                  "apkUrl": "https://github.com/%s/releases/latest/download/%s" % (repo, apk_name),
                  "apkName": apk_name,
                  "sha256": sha,
                  "sizeBytes": size_bytes,
                  "mandatory": False,
                  "publishedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "changelog": changelog,
                  "releaseUrl": "https://github.com/%s/releases/tag/%s" % (repo, tag),
                  "releaseNotesUrl": "https://github.com/%s/releases/tag/%s" % (repo, tag),
              }

          apk_name = os.path.basename(apk)
          document = manifest(channel, apk_name, sha256, size)

          # Every release carries all three channel files, so switching the channel in the app always
          # finds something instead of hitting a 404.
          written = []
          for name in ("stable", "beta", "dev"):
              path = os.path.join(os.environ["OUT_DIR"], "aurora-%s.json" % name)
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump(manifest(name, apk_name, sha256, size), handle, indent=2, ensure_ascii=False)
                  handle.write("\n")
              written.append(path)

          # Sanity-check what was just written: it is the file every phone will read.
          for path in written:
              with open(path, encoding="utf-8") as handle:
                  parsed = json.load(handle)
              assert parsed["versionCode"] == version_code, path
              assert re.fullmatch(r"[0-9a-f]{64}", parsed["sha256"]), path
              assert parsed["sizeBytes"] == os.path.getsize(apk), path
              assert parsed["apkUrl"].endswith(".apk"), path
              for key in ("schema", "channel", "package", "versionName", "versionCode", "minSdk",
                          "apkUrl", "sha256", "sizeBytes", "mandatory", "publishedAt", "changelog"):
                  assert key in parsed, "%s missing %s" % (path, key)
              print("checked %s (channel %s, %d bytes)" % (path, parsed["channel"], parsed["sizeBytes"]))

          print(json.dumps(document, indent=2, ensure_ascii=False))
          PY

          echo "Phones read the feed matching their channel:"
          echo "  https://github.com/${REPO}/releases/latest/download/aurora-${CHANNEL}.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraDialer-${{ steps.version.outputs.safe_version_name }}-${{ steps.version.outputs.version_code }}
          path: |
            dist/*.apk
            dist/aurora-*.json
          if-no-files-found: error

      - name: Publish or replace the GitHub Release
        if: ${{ inputs.publish_release && inputs.build_type != 'debug' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SAFE_VERSION_NAME: ${{ steps.version.outputs.safe_version_name }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          CHANNEL: ${{ inputs.update_channel || 'stable' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${SAFE_VERSION_NAME}-${VERSION_CODE}"

          NOTES="$(mktemp)"
          {
            echo "## Aurora Dialer \`${VERSION_NAME}\`"
            echo ""
            echo "- **Package**: \`com.aurora.dialer\`"
            echo "- **Version name**: \`${VERSION_NAME}\`"
            echo "- **Version code**: \`${VERSION_CODE}\`"
            echo "- **Min SDK**: Android 11 (API 30) · **Target SDK**: Android 16 (API 36)"
            echo "- Install over an existing Aurora Dialer build: \`adb install -r <apk>\` or just open the APK."
            echo ""
            if [ -n "${CHANGELOG_INPUT:-}" ]; then
              echo "### What changed"
              echo ""
              printf '%s\n' "${CHANGELOG_INPUT}"
            fi
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists - replacing its files (same version rebuild)."
            gh release upload "$TAG" dist/*.apk dist/aurora-*.json --clobber --repo "$REPO"
            gh release edit "$TAG" \
              --title "Aurora Dialer ${VERSION_NAME} (${VERSION_CODE})" \
              --notes-file "$NOTES" \
              --repo "$REPO"
          else
            EXTRA=""
            [ "$CHANNEL" = "stable" ] || EXTRA="--prerelease"
            gh release create "$TAG" \
              --title "Aurora Dialer ${VERSION_NAME} (${VERSION_CODE})" \
              --notes-file "$NOTES" \
              --repo "$REPO" \
              $EXTRA \
              dist/*.apk dist/aurora-*.json
          fi

          # /releases/latest/download/... must keep serving the newest STABLE build, so only a stable
          # run claims the "latest" slot; beta and dev builds are marked as pre-releases instead.
          if [ "$CHANNEL" = "stable" ]; then
            gh release edit "$TAG" --latest --repo "$REPO" || true
          else
            gh release edit "$TAG" --prerelease --repo "$REPO" || true
          fi
          rm -f "$NOTES"

          echo "Release page: https://github.com/${REPO}/releases/tag/${TAG}"
