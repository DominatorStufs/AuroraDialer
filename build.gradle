plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.google.protobuf' version '0.9.4'
}

if (project.hasProperty("customBuildDir")) {
    layout.buildDirectory.set(file(project.property("customBuildDir").toString()))
}

// The proto files are laid out AOSP-style (java/**/*.proto) and import each other with repository
// root relative names ("java/com/android/dialer/..."). protoc therefore has to search the repository
// root, but handing the repository root to Gradle as a source directory makes the whole checkout -
// build directory included - an input of every generate*Proto task, which Gradle 8.11+ rejects with
// "Task ':generateReleaseProto' uses this output of task ':compileReleaseAidl' without declaring an
// explicit or implicit dependency". The files are instead mirrored into the build directory (see the
// mirrorProtoSources task further down) and the proto source set reads that mirror, so protoc still
// sees exactly the same "java/com/..." layout while Gradle only ever tracks a directory no other task
// writes to.
def protoMirrorRoot = new File(layout.buildDirectory.get().asFile, "aurora-proto-root")

def resolveVersionName() {
    def prop = project.findProperty("versionName") ?: System.getenv("VERSION_NAME")
    if (prop != null && !prop.toString().trim().isEmpty()) {
        return prop.toString().trim()
    }
    return "26.8.25-Aurora"
}

def resolveVersionCode(String verName) {
    def prop = project.findProperty("versionCode") ?: System.getenv("VERSION_CODE")
    if (prop != null && !prop.toString().trim().isEmpty()) {
        def raw = prop.toString().trim()
        if (raw.isInteger()) {
            return Math.max(1, raw.toInteger())
        }
        def digitsOnly = raw.replaceAll("[^0-9]", "")
        if (!digitsOnly.isEmpty()) {
            if (digitsOnly.length() > 9) {
                digitsOnly = digitsOnly.substring(0, 9)
            }
            return Math.max(1, digitsOnly.toInteger())
        }
    }
    def digitsFromName = verName.replaceAll("[^0-9]", "")
    if (!digitsFromName.isEmpty()) {
        if (digitsFromName.length() > 9) {
            digitsFromName = digitsFromName.substring(0, 9)
        }
        return Math.max(1, digitsFromName.toInteger())
    }
    return 260825
}

def appVersionName = resolveVersionName()
def appVersionCode = resolveVersionCode(appVersionName)

