    }

    packaging {
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

// Copies java/**/*.proto into the build directory, keeping the java/ prefix, so that the proto source
// set handed to protoc lives in a directory of its own. The copy is incremental (Gradle's Sync task)
// and the dependency declared below is real: the mirrored files are the input of the proto tasks.
def mirrorProtoSources = tasks.register("mirrorProtoSources", Sync) {
    from(layout.projectDirectory.dir("java")) {
        include "**/*.proto"
    }
    into(new File(protoMirrorRoot, "java"))
}

tasks.withType(com.google.protobuf.gradle.GenerateProtoTask).configureEach { protoTask ->
    protoTask.dependsOn(mirrorProtoSources)
}

