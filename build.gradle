android {
    namespace 'com.aurora.dialer'
    compileSdk 36

    defaultConfig {
        applicationId "com.aurora.dialer"
        minSdk 30
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        debug {
            // Uses standard Android debug keystore or auto-generated debug key
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (file("keystore/aurora-release.jks").exists()) {
                // The key that travels with the repository. Signing every build with it is what lets
                // an installed copy be replaced — by `adb install -r`, by the app's OTA updater or by
                // simply opening the new APK — no matter which machine or CI runner built it.
                // See keystore/README.md; KEYSTORE_PATH (with KEYSTORE_PASSWORD / KEY_ALIAS /
                // KEY_PASSWORD) still takes precedence for a private key.
                storeFile file("keystore/aurora-release.jks")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            // Matches Android.bp optimize: { enabled: false } while keeping APK ~18 MB (< 25 MB)
            minifyEnabled false
            shrinkResources false
            signingConfig System.getenv("KEYSTORE_PATH")
                    || file("keystore/aurora-release.jks").exists()
                    ? signingConfigs.release : signingConfigs.debug
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'java/com/android/dialer/common/proguard.flags',
                'java/com/android/dialer/proguard/proguard.flags',
                'java/com/android/dialer/proguard/proguard_base.flags',
                'java/com/android/dialer/proguard/proguard_release.flags',
                'java/com/android/incallui/answer/impl/proguard.flags',
                'java/com/android/voicemail/impl/proguard.flags',
                'proguard.flags'
            )
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        additionalParameters '--auto-add-overlay', '--extra-packages', extraPackagesList.join(':')
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java {
                srcDirs = ['java']
                exclude 'com/android/dialer/rootcomponentgenerator/**'
            }
            aidl {
                srcDirs = ['java']
                include '**/I*.aidl', '**/CallRecording.aidl'
            }
            proto {
                // Reads the mirror produced by mirrorProtoSources, not the repository root itself -
                // see the comment on protoMirrorRoot above.
                srcDirs = [protoMirrorRoot]
                include 'java/**/*.proto'
            }
            res.srcDirs = [
                'assets/quantum/res',
